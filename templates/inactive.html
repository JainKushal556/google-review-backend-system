<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Service Paused — {{ shop.shop_name }}</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --google-blue: #1a73e8;
      --google-red: #ea4335;
      --google-yellow: #fbbc04;
      --google-green: #34a853;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --card-bg: #ffffff;
      --bg-page: #f8fafc;
      --border-color: #e2e8f0;
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-page);
      background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 20px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text-main);
    }

    .container {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: 0 16px 40px -12px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      text-align: center;
    }

    .top-bar {
      height: 4px;
      width: 100%;
      background: #94a3b8;
    }

    .content {
      padding: 32px 24px 28px;
    }

    .status-icon-box {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      color: #ef4444;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 16px;
    }

    .shop-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      background: #f1f5f9;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 8px;
    }

    .title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .desc {
      font-size: 13.5px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .card-id-tag {
      display: inline-block;
      font-family: monospace;
      font-size: 12px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 8px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar"></div>
    <div class="content">
      <div class="status-icon-box">⏸️</div>
      <div class="shop-pill">{{ shop.shop_name }}</div>
      <h1 class="title">Service Temporarily Paused</h1>
      <p class="desc">
        This Google Review card service is currently inactive. Please contact store management for assistance.
      </p>
      <div>
        <span class="card-id-tag">Card ID: {{ shop.card_id }}</span>
      </div>
    </div>
  </div>
</body>
</html>
