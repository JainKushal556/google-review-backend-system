<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Card Activating — {{ shop.shop_name }}</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --google-blue: #1a73e8;
      --google-red: #ea4335;
      --google-yellow: #fbbc04;
      --google-green: #34a853;
      --text-main: #0f172a;
      --text-sub: #475569;
      --card-bg: #ffffff;
      --bg-page: #f8fafc;
      --border-color: #e2e8f0;
      --radius-card: 20px;
      --shadow-card: 0 12px 36px -8px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-page);
      background-image: radial-gradient(#e2e8f0 0.8px, transparent 0.8px);
      background-size: 20px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text-main);
    }

    .process-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      text-align: center;
    }

    .google-bar {
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, 
        var(--google-blue) 0% 25%, 
        var(--google-red) 25% 50%, 
        var(--google-yellow) 50% 75%, 
        var(--google-green) 75% 100%
      );
    }

    .card-content {
      padding: 32px 24px 28px;
    }

    /* Icon Loader */
    .icon-wrap {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .icon-spinner {
      position: absolute;
      inset: -4px;
      border: 2.5px solid transparent;
      border-top-color: var(--google-blue);
      border-right-color: var(--google-blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .icon-inner svg {
      width: 28px;
      height: 28px;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 30px;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d97706;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    h1 {
      font-size: 19px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .sub {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 22px;
    }

    /* Steps Box */
    .steps-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .step-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    .step-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .step-icon.done {
      background: #dcfce7;
      color: #16a34a;
    }

    .step-icon.active {
      background: #fef3c7;
      color: #d97706;
    }

    .auto-check-footer {
      font-size: 11.5px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    @media (max-width: 480px) {
      .card-content { padding: 26px 18px 22px; }
      h1 { font-size: 18px; }
    }
  </style>
</head>
<body>

  <div class="process-card">
    <div class="google-bar"></div>

    <div class="card-content">
      <!-- Animated Icon -->
      <div class="icon-wrap">
        <div class="icon-spinner" id="spinnerRing"></div>
        <div class="icon-inner" id="iconCenter">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
        </div>
      </div>

      <div class="badge-status" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span id="badgeText">Card is under processing</span>
      </div>

      <h1>Activating Review Profile</h1>
      <p class="sub">{{ shop.shop_name }} এর কার্ডটি সক্রিয় করা হচ্ছে। কয়েক সেকেন্ডের মধ্যে পেজটি অটোমেটিক চালু হয়ে যাবে।</p>

      <div class="steps-card">
        <div class="step-row">
          <span class="step-icon done">✓</span>
          <span>NFC / QR Tag Connected</span>
        </div>
        <div class="step-row">
          <span class="step-row-text">
            <span class="step-icon done" style="display:inline-flex;margin-right:8px;">✓</span>
            <span>Google Business Profile Linked</span>
          </span>
        </div>
        <div class="step-row">
          <span class="step-icon active" id="step3Icon">⏳</span>
          <span id="step3Text">Generating Customer Reviews...</span>
        </div>
      </div>

      <div class="auto-check-footer">
        <span>🔄</span> Checking activation status every 2 seconds...
      </div>
    </div>
  </div>

  <script>
    const cardId = {{ shop.card_id | tojson }};
    let pollInterval = null;

    async function checkStatus() {
      try {
        const res = await fetch(`/api/card-status/${cardId}`);
        if (res.ok) {
          const data = await res.json();
          if (data.ready) {
            clearInterval(pollInterval);
            document.getElementById('statusBadge').style.background = '#dcfce7';
            document.getElementById('statusBadge').style.borderColor = '#bbf7d0';
            document.getElementById('statusBadge').style.color = '#166534';
            document.getElementById('statusDot').style.background = '#16a34a';
            document.getElementById('badgeText').textContent = '✅ Profile Activated!';

            document.getElementById('step3Icon').className = 'step-icon done';
            document.getElementById('step3Icon').textContent = '✓';
            document.getElementById('step3Text').textContent = 'Reviews Generated & Live!';
            document.getElementById('spinnerRing').style.display = 'none';

            setTimeout(() => {
              window.location.reload();
            }, 1000);
          }
        }
      } catch (err) {
        console.error("Status check failed:", err);
      }
    }

    pollInterval = setInterval(checkStatus, 2000);
    setTimeout(checkStatus, 1000);
  </script>
</body>
</html>
